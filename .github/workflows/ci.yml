name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (GUI tests headless via Xvfb on Ubuntu)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb >/dev/null
            PREFIX="xvfb-run -a"
          fi
          $PREFIX python -m pytest -m "not windows_audio" --cov=mousemusic --cov-report=term-missing

      - name: Coverage gate (>= 90% on pure core, ARCHITECTURE.md §8)
        run: python -m coverage report --include="*/mousemusic/config.py,*/mousemusic/scheduler.py,*/mousemusic/engine.py,*/mousemusic/platform/*,*/mousemusic/midi/*,*/mousemusic/mapping.py,*/mousemusic/scales.py,*/mousemusic/instruments.py,*/mousemusic/logs.py,*/mousemusic/ui/status.py,*/mousemusic/ui/controller.py,*/mousemusic/ui/strings.py,*/mousemusic/ui/window.py,*/mousemusic/ui/placement.py,*/mousemusic/ui/theme.py,*/mousemusic/preview.py,*/mousemusic/taskbar.py,*/mousemusic/ui/fit.py" --fail-under=90

      - name: --version smoke
        run: python -m mousemusic --version

      - name: --list-devices smoke (real WinMM on Windows)
        run: python -m mousemusic --list-devices

      - name: --self-test smoke (no GUI)
        run: python -m mousemusic --self-test

  build-exe:
    # §7: build the exe on every PR/push and keep it 7 days so Grace can test PRs.
    name: build exe (windows-latest)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Build onefile exe (UPX off, see mousemusic.spec)
        run: |
          python tools/release.py version-info
          pyinstaller --noconfirm mousemusic.spec

      - name: Smoke test built exe (--self-test exit code + output reaches the shell)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MouseMusic.exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "MouseMusic.exe --self-test exited $($p.ExitCode)" }
          # Piped: the windowed exe must write to the inherited handle (platform/console.py).
          $out = (& dist\MouseMusic.exe --self-test | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "piped --self-test exited $LASTEXITCODE" }
          Write-Host $out
          foreach ($want in @("PASS bundle", "PASS settings", "PASS mapping", "PASS midi", "PASS taskbar")) {
            if (-not $out.Contains($want)) { throw "missing '$want' in --self-test output" }
          }
          $ver = (& dist\MouseMusic.exe --version | Out-String)
          if (-not $ver.Contains("mousemusic ")) { throw "missing --version output: '$ver'" }
          Write-Host "MouseMusic.exe --self-test OK (output visible)"

      - name: Smoke test built exe (--play-instrument)
        shell: pwsh
        run: |
          $out = (& dist\MouseMusic.exe --play-instrument 40 --dry-run | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--play-instrument --dry-run exited $LASTEXITCODE" }
          Write-Host $out
          foreach ($want in @("Playing GM program 40 (Violin)", "msg C0 28 00", "Done:")) {
            if (-not $out.Contains($want)) { throw "missing '$want' in --play-instrument output" }
          }
          $bad = (& dist\MouseMusic.exe --play-instrument 200 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 2) { throw "invalid program exited $LASTEXITCODE, want 2" }
          if (-not $bad.Contains("0 to 127")) { throw "missing invalid-program message: '$bad'" }
          # Real WinMM: runners usually have no MIDI output, so 0 (played) or 1 (friendly E1).
          $real = (& dist\MouseMusic.exe --play-instrument 0 2>&1 | Out-String)
          Write-Host $real
          if ($LASTEXITCODE -gt 1) { throw "real --play-instrument exited $LASTEXITCODE" }
          if ($real.Contains("Traceback")) { throw "traceback in --play-instrument output" }
          exit 0  # a friendly MIDI error (1) is acceptable here

      - name: Verify embedded manifest declares DPI awareness
        run: python tools/check_manifest.py dist/MouseMusic.exe

      - uses: actions/upload-artifact@v7
        with:
          name: MouseMusic-${{ github.sha }}-win64
          path: dist/MouseMusic.exe
          retention-days: 7
          if-no-files-found: error

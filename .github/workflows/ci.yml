name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: python -m pytest -m "not windows_audio" --cov=mousemusic --cov-report=term-missing

      - name: Coverage gate (>= 90% on pure core, ARCHITECTURE.md §8)
        run: python -m coverage report --include="*/mousemusic/config.py,*/mousemusic/scheduler.py,*/mousemusic/engine.py,*/mousemusic/platform/*,*/mousemusic/midi/*,*/mousemusic/mapping.py,*/mousemusic/scales.py,*/mousemusic/instruments.py" --fail-under=90

      - name: --version smoke
        run: python -m mousemusic --version

      - name: --list-devices smoke (real WinMM on Windows)
        run: python -m mousemusic --list-devices

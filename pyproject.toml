[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mousemusic"
dynamic = ["version"]
description = "Cursor position drives MIDI output: X -> pitch, Y -> instrument."
readme = "ARCHITECTURE.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = ["pystray", "Pillow", "comtypes; sys_platform == 'win32'"]  # exact pins live in requirements.txt

[project.scripts]
mousemusic = "mousemusic.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "mousemusic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false  # assets/ and data/ are package data, not (namespace) packages

[tool.setuptools.package-data]
# Runtime files the app opens by path (icons, curation data). Without this, `pip install .`
# ships only .py files and an installed copy falls back to Tk's icon and built-in sets.
# tests/test_packaging.py checks this covers every file under them.
mousemusic = ["assets/**/*", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "windows_audio: needs a real Windows MIDI output device (skipped on CI runners)",
]

[tool.coverage.run]
source = ["mousemusic"]
branch = true
